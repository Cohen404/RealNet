# Example configuration for inference with RL-based dynamic feature selection

# Basic model configuration
net:
  name: realnet
  backbone: wide_resnet50_2
  pretrained: True
  af_type: rl
  img_size: 256
  
# Data configuration
data:
  image_size: 256
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  batch_size: 1
  num_workers: 4

# Dataset configuration
dataset:
  name: mvtec
  category: bottle  # Change this to the desired category
  root_dir: ./datasets/MVTec
  normal_dir: train/good
  test_dir: test

# Training configuration (not used in inference)
train:
  epochs: 100
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0001
  scheduler: step
  step_size: 50
  gamma: 0.1

# RL configuration
rl:
  enabled: True
  feature_selection:
    enabled: True
    dynamic_inference: True  # Enable dynamic feature selection during inference
    update_every_n_epochs: 1
    max_timesteps: 10
    save_frequency: 10
    ppo:
      lr: 0.001
      gamma: 0.99
      eps_clip: 0.2
      k_epochs: 4
      entropy_coef: 0.01
      value_coef: 0.5
    reward_weights:
      sparsity: 0.1
      diversity: 0.1
      stability: 0.1
      performance: 0.7

# Logging configuration
logging:
  print_freq: 10
  save_freq: 10
  log_dir: ./logs
  checkpoint_dir: ./checkpoints